(function(){
 const tierOf=id=>{const m=id.match(/^g_(\w+?)_/);return m?T.findIndex(t=>t.id===m[1]):0;};

  if(id.startsWith('log_')){s=P.log(LC[LOGS.findIndex(l=>'log_'+l[0]===id)]);}
  else if(id.startsWith('fish_')){s=P.fish(FC[FISH.findIndex(f=>'fish_'+f[0]===id)],false);}
  else if(id.startsWith('food_')){s=P.fish(mix(FC[FISH.findIndex(f=>'food_'+f[0]===id)],-.2),true);}
  else if(id==='ore_ess')s=P.ess();
  else if(id==='ore_pure')s=P.pure();
  else if(id.startsWith('ore_'))s=P.ore(OC[id.slice(4)]);
  else if(id.startsWith('bar_'))s=P.bar(TC[T.findIndex(t=>'bar_'+t.id===id)]);
  else if(id.startsWith('tip_'))s=P.tip(TC[T.findIndex(t=>'tip_'+t.id===id)]);
  else if(id.startsWith('arrow_'))s=P.arrow(TC[T.findIndex(t=>'arrow_'+t.id===id)]);
  else if(id.startsWith('g_')){const k=tierOf(id),c=TC[k],sl=it.slot;s=sl==='weapon'?W[TIERW[k]](c):P[sl==='ammo'?'arrow':sl](c);}
  else if(id.startsWith('ba_')){const q=id.split('_'),r=+q[3],c=RAR[r][2];s=tagItem(P[it.slot](c),c,'skull');}
  else if(id.startsWith('bw_')){const q=id.split('_'),r=+q[3],c=RAR[r][2],t=+q[2],sh=BOSSW[q[1]][t];s=tagItem(W[sh](c,mix(c,.35)),c,'skull');}
  else if(id.startsWith('bow_')){const k=+id.slice(4);s=W[BOWS[k]](LC[BOWL[k]]);}
  else if(id.startsWith('staff_')){const k=+id.slice(6);s=W[STAVES[k]](LC[BOWL[k]],STG[k]);}
  else if(id.startsWith('h_')){const c=HIC[id.split('_')[1]],sl=it.slot;s=P[sl](c);}

  else if(id.startsWith('cape_'))s=tagItem(P.cape(it.col||'#c2410c'),it.col||'#c2410c','crown');
  else if(id.startsWith('dr_'))s=tagItem(P[it.slot](it.col),it.col,'crown');
  else if(id.startsWith('tome_'))s=P.tome(it.col);
  else if(id.startsWith('estaff_'))s=P.staff(it.col);
  else if(id.startsWith('mring_'))s=P.ring(it.col);
  else if(id.startsWith('mamu_'))s=P.amulet(it.col);
  else if(id.startsWith('ring_'))s=P.ring(GC[id.slice(5)]);
  else if(id.startsWith('amu_'))s=P.amulet(GC[id.slice(4)]);
  else if(id.startsWith('gem_'))s=P.gem(GC[id.slice(4)]);
  else if(id.startsWith('rune_'))s=P.rune(id.slice(5));
  else if(id.startsWith('seed_'))s=P.seed();
  else if(id.startsWith('crop_'))s=P.crop(CRC[id.slice(5)]);
  else if(id.startsWith('herb_'))s=P.herb(HC[HERBS.findIndex(h=>'herb_'+h[0]===id)]);
  else if(id.startsWith('pot_')){const k=HERBS.findIndex(h=>id.startsWith('pot_'+h[0]+'_'));s=P.potion(HC[k]);}
  else if(id.startsWith('hide_'))s=P.hide(HIC[id.slice(5)]);
  else if(id.startsWith('cloth_'))s=P.cloth(CLC[id.slice(6)]);
  else s={vial:P.vial,bones:P.bones,dragon_bone:P.dbone,feather:P.feather,ashes:P.ashes,dragon_scale:P.scale,bbones:P.bones,wbones:P.bones}[id]();
  it.i=s;}
 ALLSK.forEach(id=>{SKN[id].i=iconForSkill(id);});
 const PI={xp:P.tome(),luck:P.clover(),dmg:P.swords(),hp:P.heart(),eat:P.potion('#d94a4a'),gold:P.bag(),off:P.house(),slot:P.person()};PERKS.forEach(p=>{p.i=PI[p.id];});

const BUILD_TS=1794944131000;

const SHA_K=(()=>{const k=[];for(let n=2;k.length<64;n++){let p=true;for(let d=2;d*d<=n;d++)if(n%d===0){p=false;break;}if(p)k.push(Math.floor((Math.cbrt(n)%1)*4294967296));}return k;})();

function sha256(msg){

 const w=new Uint32Array(64),R=(x,k)=>(x>>>k)|(x<<(32-k));

  for(let i=0;i<16;i++)w[i]=dv.getUint32(o+i*4);
  for(let i=16;i<64;i++){const a=w[i-15],c=w[i-2];w[i]=(w[i-16]+(R(a,7)^R(a,18)^(a>>>3))+w[i-7]+(R(c,17)^R(c,19)^(c>>>10)))|0;}
  let a=h[0],b2=h[1],c=h[2],d=h[3],e=h[4],f=h[5],g=h[6],hh=h[7];
  for(let i=0;i<64;i++){const t1=(hh+(R(e,6)^R(e,11)^R(e,25))+((e&f)^(~e&g))+SHA_K[i]+w[i])|0,t2=((R(a,2)^R(a,13)^R(a,22))+((a&b2)^(a&c)^(b2&c)))|0;hh=g;g=f;f=e;e=(d+t1)|0;d=c;c=b2;b2=a;a=(t1+t2)|0;}
  h[0]=(h[0]+a)|0;h[1]=(h[1]+b2)|0;h[2]=(h[2]+c)|0;h[3]=(h[3]+d)|0;h[4]=(h[4]+e)|0;h[5]=(h[5]+f)|0;h[6]=(h[6]+g)|0;h[7]=(h[7]+hh)|0;}

function hmacHex(key,text){
 const enc=new TextEncoder(),kb=enc.encode(key),m=enc.encode(text),ip=new Uint8Array(64+m.length),op=new Uint8Array(96);

 return Array.from(sha256(op),x=>x.toString(16).padStart(2,'0')).join('');}

function morph(a,b){const bc=b.childNodes;for(let i=0;i<bc.length;i++){const x=a.childNodes[i],y=bc[i];if(!x)a.appendChild(y.cloneNode(true));else patch(x,y);}while(a.childNodes.length>bc.length)a.removeChild(a.lastChild);}
function patch(x,y){
 if(x.nodeType!==y.nodeType||x.nodeName!==y.nodeName){x.replaceWith(y.cloneNode(true));return;}
 if(x.nodeType!==1){if(x.nodeValue!==y.nodeValue)x.nodeValue=y.nodeValue;return;}
 for(const at of Array.from(x.attributes))if(!y.hasAttribute(at.name))x.removeAttribute(at.name);
 for(const at of Array.from(y.attributes))if(x.getAttribute(at.name)!==at.value)x.setAttribute(at.name,at.value);
 if(x.nodeName==='TEXTAREA'||x.nodeName==='INPUT'){if(x===document.activeElement)return;if(x.nodeName==='INPUT')x.value=y.getAttribute('value')||'';else x.value=y.textContent;return;}
 morph(x,y);}

  case'bsort':UI.bsort=(UI.bsort+1)%BSORT.length;break;case'rask':UI.rsel=+d.r;break;case'rcancel':UI.rsel=null;break;case'rsell':{const r=+d.r;let g=0;Object.keys(S.bank).forEach(id=>{const it=ITEMS[id];if(it.rar===r&&!it.uniq){const n=cnt(id);g+=n*it.v;sell(id,n);}});UI.rsel=null;UI.bsel=null;if(g)toast('Sold '+RAR[r][0]+' items for 🪙 '+fmt(g),'info');break;}case'pvsync':pvSync(true);break;case'pvgo':pvStart(d.id,UI.dstake);break;case'duelgo':duelStart(d.t,UI.dstake);break;case'dstk':UI.dstake=d.v==='all'?S.coins:d.v==='half'?Math.floor(S.coins/2):+d.v;break;case'duelclr':UI.duel=null;break;case'slaybuyauto':slayBuyAuto();break;case'slayauto':slayToggleAuto();break;case'slayget':slayAssign();break;case'slayreroll':slayReroll();break;case'slayblock':slayBlock();break;case'slayunblock':slayUnblock(d.id);break;case'slayfight':{const t=S.sl.task;if(t&&!(S.cb&&S.cb.mon===t.mon)){const m=MONS[t.mon];startCombat(m.area,t.mon);}break;}case'bsel':UI.bsel=d.id;break;case'bcat':UI.bcat=d.c;break;
  case'sell':sell(d.id,+d.q);break;case'drink':usePotion(d.id);break;
  case'upg':buyUpg(d.sk);break;case'buybank':buyBank();break;case'buyplot':buyPlot(d.c);break;case'buyi':buyItem(d.id,+d.q);break;case'buyperk':buyPerk(d.id);break;
  case'pick':UI.pick=+d.i;break;case'pickclose':UI.pick=null;break;
  case'plant':if(UI.pick!=null&&plant(UI.pick,d.crop))UI.pick=null;break;
  case'harvest':harvest(+d.i);break;case'harvestall':{const n=harvestAll();if(!n)toast('Nothing is ready yet','warn');}break;case'autoplant':S.farm.auto=!S.farm.auto;break;
  case'theme':S.theme=d.t;break;

  case'copyexp':{const t=$('#exp');if(t){t.select();try{navigator.clipboard.writeText(t.value).then(()=>toast('Copied','info'),()=>{});}catch(e){}}}break;
  case'import':try{const s=importSave($('#imp').value);s.name=s.name||S.name;SAVESTAT.bak=0;saveLocal();useState(s);saveLocal();UI.msg='Backup loaded.';UI.imp='';}catch(e){UI.msg='That backup text could not be read or failed verification.';}break;
  case'resetask':UI.confirm=true;break;case'resetno':UI.confirm=false;break;
  case'reset':{const nm=S.name;SAVESTAT.bak=0;saveLocal();const f=newState();f.name=nm;useState(f);saveLocal();}UI.confirm=false;UI.page='home';UI.bsel=null;break;
  case'slotnewask':UI.modal.newN=+d.n;UI.modal.delN=null;UI.modal.warn=null;UI.nm='';break;
  case'slotnew':{const n=+d.n,s=newState();s.name=cleanName(UI.nm)||'Adventurer';deleteSlot(n);enterSlot(n,s);toast('Welcome, '+s.name+'! Pick a skill on the left to begin.','info');}break;
  case'slotplay':playSlot(+d.n,false);break;case'slotforce':playSlot(+d.n,true);break;
  case'slotdelask':UI.modal.delN=+d.n;UI.modal.newN=null;UI.modal.warn=null;break;
  case'slotdel':deleteSlot(+d.n);UI.modal.delN=null;break;
  case'slotcancel':UI.modal.newN=null;UI.modal.delN=null;UI.modal.warn=null;break;
  case'slotauto':{const m=getMeta();m.auto=!m.auto;setMeta(m);}break;
  case'slots':saveLocal();UI.modal={type:'slots',boot:false,newN:null,delN:null,warn:null};break;
  case'mspend':{const m=mSpend(d.sk,d.id,UI.mspn||1);if(m)toast(m,'warn');dirty.v=1;break;}
  case'mspn':UI.mspn=+d.n;dirty.v=1;break;
  case'savenow':saveLocal();break;
  case'clnew':{const C=CL(),c=clHex(56);lsSet(CL_K,c);C.acc=clParse(c);C.show=1;C.list=[];C.loaded=1;C.msg='Cloud code created. Upload a save to start using it.';break;}
  case'clenter':{const C=CL(),a=clParse(UI.clc);if(!a){C.msg='That does not look like a cloud code.';break;}lsSet(CL_K,a.code);C.acc=a;C.show=0;C.msg='';C.loaded=0;UI.clc='';clRefresh();break;}
  case'clshow':CL().show=!CL().show;break;case'clref':clRefresh();break;
  case'clout':{const C=CL();lsDel(CL_K);C.acc=null;C.list=null;C.show=0;C.msg='Signed out on this device. Your cloud saves are still online.';break;}
  case'clup':clUpload(false);break;case'clupf':clUpload(true);break;
  case'cldl':{const C=CL(),n=+d.n,p=d.p==='1',k=(p?'p':'d')+n;if(C.dl!==k)C.dl=k;else clDownload(n,p);break;}
  case'rename':{const n=cleanName(UI.rn);if(n){S.name=n;UI.rn='';saveLocal();}}break;
  case'switchslot':leaveSlot();break;
  case'hsjoin':{const el=$('#hsn'),v=(el?el.value:'').trim().replace(/\s+/g,' ');UI.hsn=v;if(!/^[A-Za-z0-9_ -]{3,16}$/.test(v)){UI.hsMsg=HS_ERR.bad_name;break;}S.hs.name=v;S.hs.on=true;UI.hsMsg='Joining...';hsSubmit().then(r=>{if(r!=='ok'){S.hs.on=false;}saveLocal();});break;}

  case'petset':if(S.pets[d.id]){S.pet=S.pet===d.id?'':d.id;dirty.v=1;}break;case'capeset':if(capeOk(d.sk)){S.cape=S.cape===d.sk?'':d.sk;dirty.v=1;}break;case'presask':if(canPrestige(d.sk))UI.modal={type:'prestige',sk:d.sk};break;case'presgo':prestige(d.sk);UI.modal=null;break;

  case'spin':case'spinpaid':{if(UI.wspin&&Date.now()<UI.wspin)break;const r=spinWheel(d.a==='spinpaid');if(r){const seg=360/WHEEL.length,cur=UI.wrot||0;UI.wrot=Math.ceil(cur/360)*360+360*6+(360-(r.idx+.5)*seg)+(Math.random()-.5)*seg*.6;UI.wspin=Date.now()+4400;setTimeout(render,4500);if(r.idx>=6)setTimeout(()=>toast('Wheel prize: '+WHEEL[r.idx].n+'!','boss'),4400);}}break;
  case'cheat':{const el=$('#cheat'),r=cheat(el?el.value:'');if(r){S.cheated=1;if(S.hs&&S.hs.on)hsLeave();}UI.msg2=r||'That code is not recognised.';if(r&&el){el.value='';UI.cheat='';}saveLocal();}break;}
 render();}
document.addEventListener('click',e=>{if(UI.noclick>Date.now()){e.preventDefault();return;}const had=!!UI.ctx;UI.ctx=null;const el=e.target.closest('[data-a]');if(!el||el.dataset.a==='noop'){if(had)render();return;}e.preventDefault();handle(el.dataset);});

['touchend','touchmove','touchcancel'].forEach(ev=>document.addEventListener(ev,()=>{if(lpT){clearTimeout(lpT);lpT=null;}},{passive:true}));

const TIP=document.createElement('div');TIP.id='tip';TIP.className='tip';TIP.hidden=true;document.body.appendChild(TIP);
function tipMove(e){if(e.pointerType&&e.pointerType!=='mouse'){TIP.hidden=true;return;}
 const el=e.target.closest?e.target.closest('[data-tip]'):null;if(!el||!S||UI.ctx){TIP.hidden=true;return;}
 TIP.innerHTML=tipHtml(el.dataset.tip);TIP.hidden=false;
 const w=TIP.offsetWidth,h=TIP.offsetHeight;let x=e.clientX+16,y=e.clientY+16;
 if(x+w>innerWidth-8)x=Math.max(8,e.clientX-w-12);if(y+h>innerHeight-8)y=Math.max(8,e.clientY-h-12);
 TIP.style.left=x+'px';TIP.style.top=y+'px';}
document.addEventListener('pointermove',tipMove);
['click','scroll','keydown','contextmenu'].forEach(ev=>document.addEventListener(ev,()=>{TIP.hidden=true;},{passive:true,capture:true}));

 setInterval(()=>{const D=UI.duel;if(D&&D.shown<D.rounds.length){D.shown++;dirty.v=1;}},600);
 migrateLegacy();
 const mt=getMeta();let entered=false;
 if(mt.auto&&mt.last&&!lockedElsewhere(mt.last)){const r=readSlot(mt.last);if(r&&!r.bad){enterSlot(mt.last,r.s);entered=true;}}
 if(!entered)UI.modal={type:'slots',boot:true,newN:null,delN:null,warn:null};
 try{if(localStorage.getItem('mossgate-view')!=='classic'&&!/[?&]classic/.test(location.search))W3.start();}catch(e){}
 render();
 let last=performance.now(),acc=0;
 setInterval(()=>{const now=performance.now();let d=(now-last)/1000;last=now;if(!S)return;
  if(d>3){const r=simulateOffline(d);if(d>=60&&!UI.modal&&(r.coins>0||Object.keys(r.xp).length))UI.modal={type:'offline',r,away:d};}
  else{acc+=d*(S.cheat.speed||1);let n=0;while(acc>=0.1&&n++<400){step(0.1);acc-=0.1;}}},100);
 setInterval(()=>{if(!document.hidden)render();},200);
 setInterval(saveLocal,10000);setTimeout(supCheck,4000);setInterval(supCheck,1800000);
 setInterval(()=>{if(S&&S.hs&&S.hs.on&&!document.hidden&&Date.now()-S.hs.last>600000)hsSubmit();},60000);
 document.addEventListener('visibilitychange',()=>{if(document.hidden)saveLocal();});
 window.addEventListener('pagehide',()=>{saveLocal();release();});}
boot();

try{[ITEMS,MONS,SPELLS,DUNGEONS,CROP,ACT,RELICS,SUPPLY,THIEF].forEach(__df);}catch(e){}
})();

(function(){
'use strict';
/* ===== Mossgate Idle: game data ===== */
const XPT=[0];(function(){let p=0;for(let l=1;l<120;l++){p+=Math.floor(l+300*Math.pow(2,l/7));XPT[l]=Math.floor(p/4);}})();
const MAXL=99;

const MXP=L=>Math.round(XPT[L-1]*0.06); // mastery xp needed for level L

const ITEMS={};
function mk(id,n,i,v,cat,o){ITEMS[id]=Object.assign({id,n,i,v,cat},o||{});return ITEMS[id];}
const ACT={wc:[],fish:[],mine:[],fm:[],cook:[],smith:[],fletch:[],craft:[],thief:[],agi:[],herb:[],rc:[],dung:[]};

function complete(sk,a,A){

 if(a.in){for(const k in a.in)if(cnt(k)<a.in[k]){if(!TRACK)toast('Out of materials: '+ITEMS[k].n,'warn');return false;}
  const pre=Math.min(.9,mod.pre+ml*.0025);if(!(Math.random()<pre))for(const k in a.in)take(k,a.in[k]);}
 if(kind==='dungeon')return runDungeon(sk,a,A,mod,ml);
 let mult=1;
 if(kind==='gather'||kind==='thief'){if(Math.random()<Math.min(.95,mod.dbl+ml*.0025))mult=2;}

  const ch=Math.min(.95,.5+(lv(sk)-a.lvl)*.012+ml*.004);
  if(Math.random()>=ch){ok=false;const stun=3;A.t=-stun;hurt(rnd(Math.ceil(a.dmg*.3),a.dmg));S.stats.actions++;return true;}
  addCoins(Math.round(rnd(a.coins[0],a.coins[1])*mult*cg()));
  (a.drops||[]).forEach(d=>{if(Math.random()<d[1])add(d[0],rnd(d[2],d[3])*mult);});
 }else{
  if(a.out)for(const k in a.out)add(k,a.out[k]*(kind==='gather'?mult:1));

  if(a.gem&&Math.random()<a.gem){const r=Math.random();add(r<.5?'gem_sapphire':r<.8?'gem_emerald':r<.95?'gem_ruby':'gem_diamond',1);}
 }
 gainXp(sk,a.xp*(1+mod.xp));gainM(sk,a,mxpOf(sk,a));S.stats.actions++;return true;}

const dpow=()=>{const g=(PS&&PS.g)||{};return combatLevel()+Math.min(45,((g.atk||0)+(g.str||0)+(g.def||0)+Math.max(g.rngA||0,g.magA||0))/14);};

function runDungeon(sk,a,A,mod,ml){

 const ratio=Math.pow((a.rec+8)/(dpow()+8),1.25);let cleared=0,fled=false;
 for(let f=1;f<=a.floors;f++){
  const boss=f===a.floors,dm=Math.max(1,Math.round(a.fd*ratio*(boss?1.7:1)*(0.5+Math.random())));

  if(S.hp<maxHp()*0.2){fled=true;break;}
  cleared++;}
 const frac=cleared/a.floors,xp=a.xp*(1+mod.xp);
 if(!fled){
  addCoins(Math.round(rnd(a.coins[0],a.coins[1])*cg()));
  const got=[];a.drops.forEach(d=>{if(Math.random()<d[1]){const q=rnd(d[2],d[3]);add(d[0],q);got.push([d[0],q]);}});
  const nc=(S.dg.clears[a.id]||0)+1;S.dg.clears[a.id]=nc;
  let relic=false;

  gainXp(sk,xp);gainM(sk,a,mxpOf(sk,a));
  ['atk','str','def'].forEach(c=>gainXp(c,xp*0.05*cxm()));
  dlog({id:a.id,res:'clear',floors:a.floors,xp:Math.round(xp),relic});

  gainXp(sk,xp*frac*0.4);dlog({id:a.id,res:'flee',floors:a.floors,cleared});A.t=-4;

function stepAct(A,dt){

 const m=MONS[d.mid[0]];let i=S.acts.findIndex(a=>a&&a.sk==='combat');if(i<0){i=freeSlot(UI.tgt);}clearSlot(i);
 S.acts[i]={sk:'combat',id:m.id,t:0};const old=S.cb||{};
 S.cb={area:'dungeon',mon:m.id,dg:id,wave:1,t0:S.clock,mhp:m.hp,pt:0,mt:0,rs:2,stance:old.stance||0,spell:old.spell||0,log:[],kills:0};dgs(id).tries++;dirty.v=1;}
function dungeonNext(C,M){

 if(M.dgw>d.waves.length){
  r.clears++;r.best=d.waves.length+1;const tm=S.clock-C.t0;if(!r.fast||tm<r.fast)r.fast=tm;
  const bonus=Math.round(d.bonus*cg());addCoins(bonus);const got=[];
  d.loot.forEach(l=>{if(Math.random()<l[1]){const q=rnd(l[2],l[3]);add(l[0],q);got.push([l[0],q]);}});
  const owns=id=>cnt(id)>0||Object.values(S.equip).includes(id);
  if(!owns(d.cape.id)&&!S.col[d.cape.id]){add(d.cape.id,1);S.col[d.cape.id]=1;got.push([d.cape.id,1]);if(!TRACK)toast('You conquered '+d.n+' and earned the '+d.cape.n+'!','boss');}
  r.pity=(r.pity||0)+1;const open=d.rares.filter(x=>!owns(x.id)&&!S.col[x.id]);let drop=null;
  open.forEach(x=>{if(!drop&&Math.random()<0.08)drop=x;});if(!drop&&open.length&&r.pity>=10)drop=open[rnd(0,open.length-1)];
  if(drop){add(drop.id,1);S.col[drop.id]=1;r.pity=0;got.push([drop.id,1]);if(!TRACK)toast('Rare drop: '+drop.n+'!','boss');}
  if(!got.some(g=>g[0]===d.cape.id)&&!TRACK)toast(d.n+' cleared: +'+fmt(bonus)+' coins','boss');
  C.log.unshift({c:bonus,got});if(C.log.length>6)C.log.pop();
  stopCombat();return;}
 C.wave=M.dgw+1;r.best=Math.max(r.best,M.dgw);
 const nid=M.dgw<d.waves.length?d.mid[M.dgw]:d.bid,nm=MONS[nid];C.mon=nid;C.mhp=nm.hp;C.pt=0;C.mt=0;C.rs=2;
 const i=S.acts.findIndex(a=>a&&a.sk==='combat');if(i>=0)S.acts[i].id=nid;}
function playerCombat(){
 const g=PS.g,t=PS.type;let lvl,atkB,defL=lv('def');
 if(t==='ranged'){lvl=lv('rng');atkB=g.rngA;}else if(t==='magic'){lvl=lv('mag');atkB=g.magA;}else{lvl=lv('atk');atkB=g.atk;}
 return{lvl,atkB,defRoll:(defL+8)*(g.def+64)*(1+buff('def')/100+agiB('def')),atkRoll:(lvl+8)*(atkB*GEARW+64)*(1+buff('acc')/100+agiB('acc'))*ACC_BUFF};}
function maxHitPlayer(spell){
 const t=PS.type,g=PS.g;let mh;
 if(t==='melee')mh=Math.floor(10*(0.5+(lv('str')+8)*(g.str*GEARW+64)/640));
 else if(t==='ranged')mh=Math.floor(10*(0.5+(lv('rng')+8)*((g.rngS+PS.ammoS)*GEARW+64)/640));
 else mh=Math.floor(spell.max*(1+g.magD/100)*(1+Math.max(0,lv('mag')-spell.lvl)*0.005));
 return Math.floor(mh*(1+buff('str')/100+.03*pk('dmg'))*HIT_MULT[t]);}
const hitChance=(a,d)=>a>d?1-(d+2)/(2*(a+1)):a/(2*(d+1));
function awardCombatXp(skills,x){const f=cxm();const list=skills.split('+');list.forEach(s=>gainXp(s,x/list.length*f));}
function playerAttack(C,M){
 const t=PS.type;let spell=null;
 if(t==='ranged'){const am=S.equip.ammo;if(!am||cnt(am)<1){stopCombat('Out of arrows.');return false;}take(am,1);}
 if(t==='magic'){spell=SPELLS[C.spell]||SPELLS[0];if(lv('mag')<spell.lvl)spell=SPELLS[0];
  const wi=(S.equip.weapon&&ITEMS[S.equip.weapon]&&ITEMS[S.equip.weapon].inf)||[];
  for(const k in spell.cost)if(!wi.includes(k)&&cnt(k)<spell.cost[k]){stopCombat('Out of runes for '+spell.n+'.');return false;}
  for(const k in spell.cost)if(!wi.includes(k))take(k,spell.cost[k]);}
 const pc=playerCombat(),mx=maxHitPlayer(spell);
 let dmg=0;if(Math.random()<hitChance(pc.atkRoll,M.defRoll)){const lo=Math.max(1,Math.ceil(mx*DMG_MIN));dmg=lo+Math.floor(Math.random()*(mx-lo+1));}
 const st=STANCES[t][Math.min(C.stance,STANCES[t].length-1)][1];
 if(spell)gainXp('mag',spell.xp*cxm());
 if(dmg>0&&spell&&C.dg)dmg=Math.max(1,Math.ceil(dmg*DGB[C.dg].mag));
 if(dmg>0){C.mhp-=dmg;C.last=dmg;if(spell&&spell.leech)S.hp=Math.min(maxHp(),S.hp+Math.ceil(dmg*spell.leech));awardCombatXp(st,dmg*(t==='magic'?0.3:0.4));gainXp('hp',dmg*0.133*cxm());}else C.last=0;
 if(C.mhp<=0)kill(C,M);

function kill(C,M){
 S.stats.kills++;C.kills++;if(TRACK)TRACK.kills++;
 const c=Math.round(rnd(M.coins[0],M.coins[1])*cg());addCoins(c);const got=[];
 M.drops.forEach(d=>{if(Math.random()<d[1]){const q=rnd(d[2],d[3]);lootAdd(d[0],q);got.push([d[0],q]);}});
 if(M.boss&&!M.dg){S.bk[M.id]=(S.bk[M.id]||0)+1;S.bpity[M.id]=(S.bpity[M.id]||0)+1;
  if(Math.random()<M.wch||S.bpity[M.id]>=8){S.bpity[M.id]=0;const r=pickRarity(),id='bw_'+M.id+'_'+rnd(0,2)+'_'+r;lootAdd(id,1);S.col[id]=1;got.push([id,1]);
   if(!TRACK&&r>=2)toast('Boss drop: '+ITEMS[id].n+' ('+RAR[r][0]+')','boss');}
  S.bpity[M.id+'_a']=(S.bpity[M.id+'_a']||0)+1;
  if(Math.random()<0.25||S.bpity[M.id+'_a']>=10){S.bpity[M.id+'_a']=0;const r=pickRarity(),id='ba_'+M.id+'_'+rnd(0,5)+'_'+r;lootAdd(id,1);S.col[id]=1;got.push([id,1]);
   if(!TRACK&&r>=2)toast('Armour drop: '+ITEMS[id].n+' ('+RAR[r][0]+')','boss');}}
 C.log.unshift({c,got});if(C.log.length>6)C.log.pop();C.rs=M.boss?6:3;C.mhp=0;
 if(!C.dg&&S.bag.mode==='stop'&&S.bag.n>=bagCap()){stopCombat('Your loot bag is full.');return;}

function monsterAttack(C,M){

function stepCombat(dt){

const BUILD_TS=1794716475000;
const SIGKEY=['mg','8f2c','-gate','Q7x','r0ot','5e1d','|idle','b9'].join('');
const SHA_K=(()=>{const k=[];for(let n=2;k.length<64;n++){let p=true;for(let d=2;d*d<=n;d++)if(n%d===0){p=false;break;}if(p)k.push(Math.floor((Math.cbrt(n)%1)*4294967296));}return k;})();
const SHA_H=(()=>{const h=[];for(let n=2;h.length<8;n++){let p=true;for(let d=2;d*d<=n;d++)if(n%d===0){p=false;break;}if(p)h.push(Math.floor((Math.sqrt(n)%1)*4294967296));}return h;})();
function sha256(msg){
 const h=SHA_H.slice(),l=msg.length,n=((l+9+63)>>6)<<6,b=new Uint8Array(n);b.set(msg);b[l]=0x80;
 const dv=new DataView(b.buffer);dv.setUint32(n-4,(l*8)>>>0);dv.setUint32(n-8,Math.floor(l*8/4294967296));
 const w=new Uint32Array(64),R=(x,k)=>(x>>>k)|(x<<(32-k));
 for(let o=0;o<n;o+=64){
  for(let i=0;i<16;i++)w[i]=dv.getUint32(o+i*4);
  for(let i=16;i<64;i++){const a=w[i-15],c=w[i-2];w[i]=(w[i-16]+(R(a,7)^R(a,18)^(a>>>3))+w[i-7]+(R(c,17)^R(c,19)^(c>>>10)))|0;}
  let a=h[0],b2=h[1],c=h[2],d=h[3],e=h[4],f=h[5],g=h[6],hh=h[7];
  for(let i=0;i<64;i++){const t1=(hh+(R(e,6)^R(e,11)^R(e,25))+((e&f)^(~e&g))+SHA_K[i]+w[i])|0,t2=((R(a,2)^R(a,13)^R(a,22))+((a&b2)^(a&c)^(b2&c)))|0;hh=g;g=f;f=e;e=(d+t1)|0;d=c;c=b2;b2=a;a=(t1+t2)|0;}
  h[0]=(h[0]+a)|0;h[1]=(h[1]+b2)|0;h[2]=(h[2]+c)|0;h[3]=(h[3]+d)|0;h[4]=(h[4]+e)|0;h[5]=(h[5]+f)|0;h[6]=(h[6]+g)|0;h[7]=(h[7]+hh)|0;}
 const out=new Uint8Array(32),ov=new DataView(out.buffer);h.forEach((x,i)=>ov.setUint32(i*4,x>>>0));return out;}
function hmacHex(key,text){
 const enc=new TextEncoder(),kb=enc.encode(key),m=enc.encode(text),ip=new Uint8Array(64+m.length),op=new Uint8Array(96);
 for(let i=0;i<64;i++){const k=i<kb.length?kb[i]:0;ip[i]=k^0x36;op[i]=k^0x5c;}
 ip.set(m,64);op.set(sha256(ip),64);
 return Array.from(sha256(op),x=>x.toString(16).padStart(2,'0')).join('');}
function lsGet(k){try{return localStorage.getItem(k);}catch(e){return null;}}
function lsSet(k,v){try{localStorage.setItem(k,v);return true;}catch(e){return false;}}
function lsDel(k){try{localStorage.removeItem(k);}catch(e){}}
function getMeta(){try{return Object.assign({auto:false,last:0},JSON.parse(lsGet(META)||'{}'));}catch(e){return{auto:false,last:0};}}
function setMeta(m){lsSet(META,JSON.stringify(m));}
function serialize(){S.saved=Date.now();const d=JSON.stringify(S);return JSON.stringify({v:2,d,g:hmacHex(SIGKEY,d)});}
function parseSave(txt){let o=JSON.parse(txt);
 if(o&&o.v===2&&typeof o.d==='string'){if(o.g!==hmacHex(SIGKEY,o.d))throw new Error('save failed verification');o=JSON.parse(o.d);}
 else if(!o||typeof o!=='object'||!(o.saved<BUILD_TS))throw new Error('unsigned save');
 if(!o||typeof o!=='object'||!o.xp||!o.bank)throw new Error('bad save');return Object.assign(newState(),o);}
function readSlot(n){let seen=false;for(const k of[SK(n),SK(n)+'-bak']){const t=lsGet(k);if(t){seen=true;try{return{s:parseSave(t),bak:k.slice(-4)==='-bak'};}catch(e){}}}return seen?{bad:true}:null;}
function summarize(s){const o=S;S=s;try{return{name:s.name||'Adventurer',tl:totalLevel(),cl:combatLevel(),play:s.play||0,coins:s.coins||0,saved:s.saved||0};}finally{S=o;}}
function slotInfo(n){const r=readSlot(n);if(!r)return null;if(r.bad)return{bad:true,name:'Unreadable'};const i=summarize(r.s);i.bak=r.bak;return i;}
function ownerOf(n){try{return JSON.parse(lsGet(SK(n)+'-own'));}catch(e){return null;}}
function lockedElsewhere(n){const o=ownerOf(n);return!!(o&&o.id!==TABID&&Date.now()-o.ts<120000);}
function claim(n){lsSet(SK(n)+'-own',JSON.stringify({id:TABID,ts:Date.now()}));}
function release(){if(!SLOT)return;const o=ownerOf(SLOT);if(o&&o.id===TABID)lsDel(SK(SLOT)+'-own');}
function saveLocal(){
 if(!S||!SLOT)return false;
 if(lockedElsewhere(SLOT)){if(SAVESTAT.ok)toast('This save is open in another tab, so this tab stopped saving.','warn');SAVESTAT.ok=false;SAVESTAT.err='Open in another tab';return false;}
 const k=SK(SLOT),txt=serialize(),old=lsGet(k);
 if(old&&Date.now()-SAVESTAT.bak>300000){try{parseSave(old);if(lsSet(k+'-bak',old))SAVESTAT.bak=Date.now();}catch(e){}}
 const ok=lsSet(k,txt);if(ok)claim(SLOT);
 if(!ok&&SAVESTAT.ok)toast('Could not save: browser storage is full or blocked. Use Show backup text.','warn');
 SAVESTAT.ok=ok;SAVESTAT.err=ok?'':'Storage full or blocked';if(ok)SAVESTAT.at=Date.now();return ok;}
function migrateLegacy(){const t=lsGet(LEGACY);if(!t||lsGet(SK(1)))return;try{const s=parseSave(t);if(!s.name)s.name='Adventurer';const o_=S;S=s;let sg;try{sg=serialize();}finally{S=o_;}if(lsSet(SK(1),sg)){lsSet(LEGACY+'-migrated',t);lsDel(LEGACY);}}catch(e){}}

 switch(code){

  case'MYTHIC':BOSSDEF.forEach(b=>{for(let t=0;t<3;t++){const id='bw_'+b[1]+'_'+t+'_4';add(id,1);S.col[id]=1;}});BOSSDEF.forEach(b=>{for(let p=0;p<6;p++){const id='ba_'+b[1]+'_'+p+'_4';add(id,1);S.col[id]=1;}});return'Added every Mythic boss weapon and armour piece. Check your bank.';
  case'MAXSHOP':Object.keys(TOOLS).forEach(k=>S.upg[k]=UPG_MAX);PERKS.forEach(p=>S.perk[p.id]=p.max);ensure(S);return'Every upgrade and perk is maxed.';
  case'SPIN':S.wheel.last=0;return'The wheel is ready to spin.';

 }

/* ---------- DOM morph (keeps focus and hover while re-rendering) ---------- */
function morph(a,b){const bc=b.childNodes;for(let i=0;i<bc.length;i++){const x=a.childNodes[i],y=bc[i];if(!x)a.appendChild(y.cloneNode(true));else patch(x,y);}while(a.childNodes.length>bc.length)a.removeChild(a.lastChild);}
function patch(x,y){
 if(x.nodeType!==y.nodeType||x.nodeName!==y.nodeName){x.replaceWith(y.cloneNode(true));return;}
 if(x.nodeType!==1){if(x.nodeValue!==y.nodeValue)x.nodeValue=y.nodeValue;return;}
 for(const at of Array.from(x.attributes))if(!y.hasAttribute(at.name))x.removeAttribute(at.name);
 for(const at of Array.from(y.attributes))if(x.getAttribute(at.name)!==at.value)x.setAttribute(at.name,at.value);
 if(x.nodeName==='TEXTAREA'||x.nodeName==='INPUT'){if(x===document.activeElement)return;if(x.nodeName==='INPUT')x.value=y.getAttribute('value')||'';else x.value=y.textContent;return;}
 morph(x,y);}

 else if(A.sk==='combat'){const M=MONS[A.id];inner=`<span class="at">${M.i} ${M.n}</span><span class="hpw">${bar(pc(S.hp,maxHp()),'hp')}<em>${Math.ceil(S.hp)}/${maxHp()}</em></span>`;}
 else{const x=actBy(A.sk,A.id);inner=`<span class="at">${SKN[A.sk].i} ${x.n}</span>${bar(pc(Math.max(0,A.t),interval(A.sk,x)))}`;}
 return`<div class="sl${UI.tgt===i?' tgt':''}${A&&A.sk==='combat'?' cmb':''}" role="button" tabindex="0" data-a="slot" data-i="${i}" title="New actions start in the highlighted slot"><b class="sn">${'ABC'[i]}</b>${inner}${A?`<button class="btn sm" data-a="stopslot" data-i="${i}" aria-label="Stop">✕</button>`:''}</div>`;}
function topHtml(){return`<button class="burger" data-a="navtoggle" aria-label="Menu">☰</button><div class="tslots">${S.acts.map((a,i)=>slotHtml(i)).join('')}</div><div class="coins">🪙 ${fmt(S.coins)}</div>`;}

function skHead(sk){
 const L=lv(sk),x=S.xp[sk],cur=XPT[L-1],nx=L>=MAXL?cur:XPT[L];
 let h=`<div class="panel"><div class="row"><span class="ci">${SKN[sk].i}</span><div><h2 style="margin:0">${SKN[sk].n}</h2><div class="sub">${SKN[sk].d}</div></div><div class="sp"></div><div style="text-align:right"><b>Level ${L}</b> / ${MAXL}${prN(sk)?' <span class="pill">★'+prN(sk)+' · +'+Math.round(PRES_B*prN(sk)*100)+'% XP</span>':''}<div class="sub">${fmt(x)} XP${L<MAXL?' · '+fmt(nx-x)+' to next':''}</div></div></div>`;
 h+=`<div style="margin-top:8px">${bar(L>=MAXL?100:pc(x-cur,nx-cur),'xp big')}</div>`;
 if(SKN[sk]&&S.mast[sk]){const p=poolPct(sk);
  h+=`<div class="row" style="margin-top:10px"><b style="color:var(--mast)">Mastery pool</b><span class="sub">${fmt(S.mast[sk].pool)} / ${fmt(poolMax(sk))} (${(p*100).toFixed(1)}%)</span></div><div style="position:relative">${bar(p*100,'mast big')}</div>`;
  h+='<div class="cps">'+CPS.map(c=>`<span class="${p>=c[0]?'got':''}">${p>=c[0]?'✔':'○'} ${Math.round(c[0]*100)}%: ${c[1]}</span>`).join('')+'</div>';
  if(sk==='agi'){const L=lvlOf(S.xp.agi);h+='<div class="row" style="margin-top:10px"><b>Agility level buffs</b><span class="sub">permanent, apply everywhere</span></div><div class="cps">'+AGB.map(b=>`<span class="${L>=b[0]?'got':''}">${L>=b[0]?'✔':'○'} Lv ${b[0]}: ${b[1]}</span>`).join('')+'</div>';}
  const u=S.upg[sk]||0;if(TOOLS[sk]&&u)h+=`<div class="sub" style="margin-top:6px">Tool: ${UPG_N[u-1]} ${TOOLS[sk]} (−${u*6}% action time)</div>`;}
 return h+'</div>';}

function actCard(sk,a){
 const locked=lv(sk)<a.lvl,A=S.acts.find(x=>x&&x.sk===sk&&x.id===a.id),on=!!A,mod=skMods(sk),ml=mLvl(sk,a.id),kind=SKKIND[sk],iv=interval(sk,a);
 let io='';
 if(a.in)io+='<div class="io"><b>Uses</b>'+Object.keys(a.in).map(k=>ic(k,0,a.in[k])).join('')+'</div>';
 if(a.out)io+='<div class="io"><b>Makes</b>'+Object.keys(a.out).map(k=>ic(k,a.out[k])).join('')+'</div>';
 const oid=a.out&&Object.keys(a.out)[0],oit=oid&&ITEMS[oid];
 if(oit&&oit.st){io+=`<div class="io statln">${statShort(oit)}${oit.wt?' · '+oit.wt+' '+oit.sp+'s':''}${oit.lr?' · needs '+SKN[oit.lr[0]].n+' '+oit.lr[1]:''}</div>`;}
 else if(oit&&oit.heal)io+=`<div class="io statln">Heals ${oit.heal} HP</div>`;
 else if(oit&&oit.pot)io+=`<div class="io statln">+${oit.pot.v}% ${PDESC[oit.pot.t]}</div>`;
 if(kind==='thief'){io+=`<div class="io"><b>Loot</b>${a.drops.map(d=>`<span class="dgi" data-tip="${d[0]}" title="${Math.round(d[1]*100)}% chance">${ITEMS[d[0]].i}<span>${ITEMS[d[0]].n}</span></span>`).join('')}</div><div class="io">Success ${Math.round(Math.min(.95,.5+(lv(sk)-a.lvl)*.012+ml*.004)*100)}% · 🪙 ${a.coins[0]}–${a.coins[1]} · hurts up to ${a.dmg}</div>`;}
 else if(kind==='dungeon'){const r=dpow()/a.rec,rk=r>=1.2?['Easy','good']:r>=1?['Fair','']:r>=.85?['Risky','gold']:['Deadly','bad'],cl=S.dg.clears[a.id]||0,gt=S.dg.relics[a.relic];
  io+=`<div class="io"><b>${a.floors}</b> floors · boss ${a.boss} · recommended combat <b>${a.rec}</b> · <span class="${rk[1]}">${rk[0]}</span></div><div class="io">🪙 ${fmt(a.coins[0])}–${fmt(a.coins[1])} · cleared <b>${cl}</b> · Relic: ${gt?'<span class="good">'+RELICS[a.relic][0]+'</span>':'<span class="sub">not found'+(cl?' ('+Math.max(0,15-cl)+' clears to guarantee)':'')+'</span>'}</div>`;}
 else if(a.coins)io+=`<div class="io"><b>Earns</b>🪙 ${a.coins[0]}–${a.coins[1]}</div>`;
 const m0=MXP(ml),m1=ml>=99?m0:MXP(ml+1);
 let pct=0;if(on)pct=pc(Math.max(0,A.t),iv);
 const dc=Math.round(Math.min(.95,(kind==='art'?mod.pre:mod.dbl)+ml*.0025)*100);
 return`<div class="card${locked?' locked':''}${on?' on':''}" role="button" tabindex="0" data-a="start" data-sk="${sk}" data-id="${a.id}">
 <div class="ch"${oit&&(oit.st||oit.heal||oit.pot)?` data-tip="${oid}"`:''}><span class="ci">${a.i}</span><div><div class="cn">${a.n}</div><div class="cm">${locked?'<span class="bad">Requires level '+a.lvl+'</span>':'Level '+a.lvl}</div></div></div>
 <div class="stats"><span><b>${(a.xp*(1+mod.xp)).toFixed(a.xp<20?1:0)}</b> XP</span><span><b>${iv.toFixed(1)}s</b></span>${kind==='gather'||kind==='thief'?`<span>double <b>${dc}%</b></span>`:kind==='art'?`<span>save <b>${dc}%</b></span>`:''}</div>${io}
 <div class="row" style="gap:6px"><span class="sub" style="color:var(--mast)">Mastery ${ml}</span><div class="sp">${bar(ml>=99?100:pc(mXp(sk,a.id)-m0,m1-m0),'mast thin')}</div></div>
 ${on?bar(pct,'big'):''}</div>`;}


function dungPanel(){
 const f=id=>RELICS.reduce((n,r,i)=>n+(S.dg.relics[i]&&r[1]===id?1:0),0);
 const have=Object.keys(S.dg.relics).filter(k=>S.dg.relics[k]).length;
 let h=`<div class="panel"><h2>Relics <span class="pill">${have}/${RELICS.length}</span></h2><div class="sub">Each dungeon hides one relic (6% per full clear, guaranteed by the 15th clear). Relics give permanent bonuses.</div><div class="grid sm" style="margin-top:8px">`;
 RELICS.forEach((r,i)=>{const got=S.dg.relics[i],d=DUNG[i];h+=`<div class="card static${got?'':' locked'}"><div class="ch"><span class="ci">${P.relic(got?d[7]:'#666')}</span><div><div class="cn">${got?r[0]:'???'}</div><div class="cm">${got?r[2]:d[1]}</div></div></div></div>`;});
 h+='</div></div>';
 const L=S.dg.log;
 h+=`<div class="panel"><h3>Recent runs</h3><div class="log">${L.length?L.map(l=>{const a=actBy('dung',l.id);if(!a)return'';return l.res==='clear'?`<div>✔ ${a.n} cleared · +${fmt(l.xp)} XP${l.relic?' · relic!':''}</div>`:l.res==='flee'?`<div>↩ Retreated from ${a.n} after ${l.cleared} of ${l.floors} floors</div>`:`<div>💤 Resting before ${a.n}…</div>`;}).join(''):'<div>No runs yet.</div>'}</div></div>`;
 return h;}
function skillPage(sk){
 if(sk==='farm')return farmPage();
 let h=skHead(sk)+(sk==='dung'?dungPanel():'')+'<div class="grid">';
 ACT[sk].forEach(a=>{h+=actCard(sk,a);});
 return h+'</div>';}

function farmPage(){
 let h=skHead('farm');
 h+=`<div class="panel"><div class="row"><button class="btn pri" data-a="harvestall">Harvest all ready</button><button class="btn${S.farm.auto?' pri':''}" data-a="autoplant">Auto-replant: ${S.farm.auto?'On':'Off'}</button><span class="sub">Crops grow in real time, even while you are away. Seeds are used from your bank, or bought on the spot. Tree seeds cannot be bought: they drop from monsters and from thieving Farmers and Master Farmers.</span></div></div>`;
 ['allot','herb','tree'].forEach(cat=>{
  h+=`<div class="panel"><h2>${cat==='allot'?'Allotments':cat==='herb'?'Herb patches':'Tree patches'} <span class="pill">${S.farm[cat]}/${PLOT_MAX[cat]}</span></h2><div class="grid sm">`;
  plotsOf(cat).forEach(([p,i])=>{
   if(!p.crop)h+=`<div class="card" role="button" tabindex="0" data-a="pick" data-i="${i}"><div class="ch"><span class="ci">🟫</span><div><div class="cn">Empty plot</div><div class="cm">${cat==='tree'?'Tap to plant a tree seed':'Tap to plant'}</div></div></div></div>`;
   else{const c=CROPBY[p.crop],ready=S.clock>=p.ready;
    h+=`<div class="card${ready?' on':''}" role="button" tabindex="0" data-a="${ready?'harvest':'noop'}" data-i="${i}"><div class="ch"><span class="ci">${ready?'🧺':cat==='tree'?'🌳':'🌱'}</span><div><div class="cn">${c.n}</div><div class="cm">${ready?'<b class="good">Ready to harvest</b>':fmtT(p.ready-S.clock)+' left'}</div></div></div>${bar(ready?100:pc(S.clock-p.start,p.ready-p.start))}</div>`;}});
  h+='</div></div>';});
 if(UI.pick!=null&&S.farm.plots[UI.pick]&&!S.farm.plots[UI.pick].crop){
  const cat=S.farm.plots[UI.pick].cat;
  h+=`<div class="panel"><div class="row"><h2 style="margin:0">Choose a crop</h2><div class="sp"></div><button class="btn sm" data-a="pickclose">Cancel</button></div><div class="tw"><table><tr><th>Crop</th><th>Level</th><th>XP</th><th>Grows</th><th>Yield</th><th>Seeds</th><th></th></tr>`;
  CROP.filter(c=>c.cat===cat).forEach(c=>{const lock=lv('farm')<c.lvl,have=cnt(c.seed);
   h+=`<tr><td>${c.i} ${c.n}</td><td class="${lock?'bad':''}">${c.lvl}</td><td>${c.xp}</td><td>${fmtT(c.t)}</td><td>${c.q[0]}–${c.q[1]}</td><td>${have?have+' owned':c.noBuy?'<span class="sub">drops only</span>':'🪙 '+c.seedCost}</td><td><button class="btn sm pri${lock||(c.noBuy&&!have)?' off':''}" data-a="plant" data-crop="${c.id}">Plant</button></td></tr>`;});
  h+='</table></div></div>';}
 return h;}

function monCard(M){
 const on=S.cb&&S.cb.mon===M.id;
 let bw='';if(M.boss){const col=Object.keys(S.col).filter(k=>k.startsWith('bw_'+M.id+'_')).length;bw=`<div class="io"><b>Weapons</b>${[0,1,2].map(t=>ITEMS['bw_'+M.id+'_'+t+'_4'].i).join('')}<span class="sub">${Math.round(M.wch*100)}% per kill (guaranteed every 8)</span></div><div class="io">${RAR.map((r,i)=>`<span style="color:${r[2]};font-size:12px">${r[0]} ${RARW[i]}%</span>`).join(' · ')}</div><div class="io"><b>Armour</b>${[0,1,2,3,4,5].map(p=>ITEMS['ba_'+M.id+'_'+p+'_4'].i).join('')}<span class="sub">25% per kill (guaranteed every 10), same rarities</span></div><div class="io"><b>Collected</b>weapons ${col}/15 · armour ${Object.keys(S.col).filter(k=>k.startsWith('ba_'+M.id+'_')).length}/30 · <b>Kills</b>${S.bk[M.id]||0}</div>`;}
 const dr=M.drops.filter(d=>d[0]!=='bones').slice(0,5).map(d=>ITEMS[d[0]].i).join(' ');
 return`<div class="card${on?' on':''}" role="button" tabindex="0" data-a="mon" data-id="${M.id}"><div class="ch"><span class="ci">${M.i}</span><div><div class="cn">${M.n}${M.boss?' <span class="pill">Boss</span>':''}</div><div class="cm">Combat level ${M.cb}</div></div></div>
 <div class="stats"><span>HP <b>${M.hp}</b></span><span>Max hit <b>${M.maxHit}</b></span><span>🪙 <b>${M.coins[0]}–${M.coins[1]}</b></span></div>${bw}<div class="io"><b>Drops</b> ${dr||'—'}</div>
 <button class="btn ${on?'dng':'pri'} sm" style="align-self:flex-start">${on?'Stop fighting':'Fight'}</button></div>`;}

function dungeonsPage(){
 const own=id=>cnt(id)>0||Object.values(S.equip).includes(id)||!!S.col[id];
 let h=`<div class="panel"><div class="row"><h2 style="margin:0">Dungeons</h2><span class="pill">Combat level ${combatLevel()}</span></div><div class="sub" style="margin-top:6px">Fight through waves of enemies with no rest in between, then face the boss. Fall and you start again from wave 1. Clear a dungeon for its signature <b>cape</b> on the first win, plus a chance at rare gear on every clear. Bring food and your best gear. (Looking for the Dungeoneering skill? It is under Skills.)</div></div><div class="grid dgs">`;
 DUNGEONS.forEach(d=>{
  const r=dgs(d.id),ok=combatLevel()>=d.req,on=S.cb&&S.cb.dg===d.id,total=d.waves.length+1;
  const item=id=>{const it=ITEMS[id],o=own(id);return`<span class="dgi${o?' got':''}" data-tip="${id}" title="${it.n}">${it.i}<span>${it.n}</span>${o?'<b>✔</b>':''}</span>`;};
  const mons=d.mid.map(id=>MONS[id]).concat([MONS[d.bid]]);
  let live='';if(on){const C=S.cb,M=MONS[C.mon];live=`<div class="dglive"><b>Wave ${C.wave<total?C.wave+'/'+d.waves.length:'Boss'}</b> · ${M.n}${bar(pc(Math.max(0,C.mhp),M.hp),'hp')}<span class="sub">You: ${Math.ceil(S.hp)} / ${maxHp()} HP</span></div>`;}
  h+=`<div class="panel dgc${on?' on':''}"><div class="row"><h3 style="margin:0">${d.i} ${d.n}</h3><div class="sp"></div><span class="pill${ok?'':' bad'}">Combat ${d.req}+</span></div>
  <div class="sub" style="margin-top:4px">${d.desc}</div>
  <div class="stats" style="margin-top:8px"><span>Best <b>${r.best>=total?'Cleared':r.best?'Wave '+r.best:'-'}</b></span><span>Attempts <b>${r.tries}</b></span><span>Clears <b>${r.clears}</b></span>${r.fast?`<span>Fastest <b>${fmtT(r.fast)}</b></span>`:''}<span>Clear bonus <b>🪙 ${fmt(d.bonus)}</b></span></div>
  <div class="dgw">${mons.map((m,k)=>`<span class="chip${on&&S.cb.wave===k+1?' on':''}" title="HP ${fmt(m.hp)} · max hit ${m.maxHit}">${k<d.waves.length?k+1:'Boss'} · ${m.n} <small>${m.cb}</small></span>`).join('')}</div>
  <div class="dgr"><b>First clear</b>${item(d.cape.id)}</div><div class="dgr"><b>Rare drops</b><span class="sub">8% each per clear, guaranteed within 10 clears</span>${d.rares.map(x=>item(x.id)).join('')}</div>
  <div class="dgr"><b>Also drops</b>${d.loot.map(l=>`<span class="dgi">${ITEMS[l[0]].i}<span>${ITEMS[l[0]].n}</span></span>`).join('')}</div>
  ${live}<div class="row" style="margin-top:10px"><button class="btn ${on?'dng':'pri'}${ok||on?'':' off'}" data-a="dgn" data-id="${d.id}">${on?'Leave '+d.n:ok?'Enter '+d.n:'Requires combat level '+d.req}</button></div></div>`;});
 return h+'</div>';}
function bagPanel(){
 const B=S.bag,cap=bagCap(),ids=Object.keys(B.items).sort((a,b)=>ITEMS[b].v*B.items[b]-ITEMS[a].v*B.items[a]);
 let val=0;ids.forEach(id=>{val+=ITEMS[id].v*B.items[id];});
 let h=`<div class="panel"><div class="row"><h3 style="margin:0">🎒 Loot bag</h3><span class="pill${B.n>=cap?' bad':''}">${fmt(B.n)} / ${fmt(cap)}</span><div class="sp"></div><span class="sub">Worth 🪙 ${fmt(val)}</span></div>${bar(pc(B.n,cap),B.n>=cap?'hp':'')}
 <div class="row" style="margin-top:8px"><button class="btn pri sm${ids.length?'':' off'}" data-a="bagall">Move all to bank</button><button class="btn sm${ids.length?'':' off'}" data-a="bagsell">Sell all</button><button class="tag${B.mode==='stop'?' on':''}" data-a="bagmode">When full: ${B.mode==='stop'?'stop fighting':'send to bank'}</button></div>
 <div class="sub" style="margin-top:6px">Everything enemies drop lands here. Tap an item to send that stack to the bank. Upgrade the bag in the Shop.</div>
 <div class="bagl">${ids.length?ids.map(id=>{const it=ITEMS[id];return`<button class="chip bagi" data-a="bagtake" data-id="${id}" data-tip="${id}"${rc(it)}>${it.i} ${it.n} ×${fmt(B.items[id])}</button>`;}).join(''):'<span class="sub">Empty. Kill something.</span>'}</div></div>`;
 return h;}
function combatPage(){

 COMBAT.forEach(c=>{const L=lv(c[0]),x=S.xp[c[0]],cur=XPT[L-1],nx=L>=MAXL?cur:XPT[L];h+=`<div class="tile" style="cursor:default"><div class="tl"><span>${c[2]} ${c[1]}</span><span>${L}</span></div>${bar(L>=MAXL?100:pc(x-cur,nx-cur),'xp thin')}</div>`;});
 h+='</div></div>';
 /* loadout */
 const t=PS.type,M=S.cb?MONS[S.cb.mon]:null;
 h+=`<div class="panel"><h3>Loadout</h3><div class="stats"><span>Style <b>${t}</b></span><span>Attack speed <b>${PS.sp}s</b></span>`;
 const pcb=playerCombat();let sp=null;if(t==='magic'){sp=SPELLS[S.cb?S.cb.spell:Math.min(UI.spell||0,SPELLS.length-1)]||SPELLS[0];}
 h+=`<span>Max hit <b>${maxHitPlayer(sp||SPELLS[0])}</b></span>${M?`<span>Hit chance <b>${Math.round(hitChance(pcb.atkRoll,M.defRoll)*100)}%</b></span>`:''}</div>`;
 const stl=STANCES[t];const cur=S.cb?Math.min(S.cb.stance,stl.length-1):Math.min(UI.stance||0,stl.length-1);
 h+='<div class="row" style="margin-top:8px"><b>Stance</b><div class="chips">'+stl.map((s,i)=>`<button class="tag${cur===i?' on':''}" data-a="stance" data-i="${i}">${s[0]} · ${s[1].split('+').map(k=>STN[k]).join(' + ')} XP</button>`).join('')+'</div></div>';

  h+='<div class="row" style="margin-top:8px"><b>Spell</b><div class="chips">'+SPELLS.map((s,i)=>[s,i]).sort((a,b)=>a[0].lvl-b[0].lvl).map(([s,i])=>`<button class="tag${cs===i?' on':''}${lv('mag')<s.lvl?' off':''}" data-a="spell" data-i="${i}" title="Level ${s.lvl}">${s.n} · ${s.max}</button>`).join('')+'</div></div>';
  {const sp0=SPELLS[cs]||SPELLS[0],wi=(S.equip.weapon&&ITEMS[S.equip.weapon].inf)||[];h+=`<div class="sub" style="margin-top:6px"><b>${sp0.n}</b> (level ${sp0.lvl}) uses ${Object.keys(sp0.cost).map(k=>(wi.includes(k)?'<s>':'')+sp0.cost[k]+' '+ITEMS[k].n+(wi.includes(k)?'</s> free':'')).join(', ')}${sp0.leech?' · heals you for '+Math.round(sp0.leech*100)+'% of the damage':''}</div>`;}
  h+='<div class="sub" style="margin-top:4px">Cost: '+Object.keys(sp.cost).map(k=>ic(k,0,sp.cost[k])).join(' ')+'</div>';}
 if(t==='ranged')h+='<div class="sub" style="margin-top:6px">Arrows: '+(S.equip.ammo?ic(S.equip.ammo,cnt(S.equip.ammo)):'<span class="bad">none equipped</span>')+'</div>';
 const f=S.equip.food;h+='<div class="sub" style="margin-top:6px">Food: '+(f&&cnt(f)?ic(f,cnt(f))+' heals '+ITEMS[f].heal:'<span class="bad">no food equipped</span> (cook fish, then equip it from the Bank)')+'</div></div>';
 h+=bagPanel();
 /* fight */
 if(S.cb){const C=S.cb;
  h+=`<div class="panel"><div class="fight"><div class="fighter"><div class="big">${playerPortrait()}</div><b>${S.name||'You'}</b>${bar(pc(S.hp,maxHp()),'hp big')}<div class="sub">${Math.ceil(S.hp)} / ${maxHp()} HP</div>${bar(pc(C.pt,PS.sp),'thin')}<div class="hit">${C.mlast!=null&&C.mlast>0?'−'+C.mlast:C.mlast===0?'dodged':''}</div></div>
  <div class="fighter"><div class="big">${M.i}</div><b>${C.dg?(C.wave<=DGB[C.dg].waves.length?'Wave '+C.wave+'/'+DGB[C.dg].waves.length+' · ':'Boss · ')+M.n:M.n}</b>${bar(pc(Math.max(0,C.mhp),M.hp),'hp big')}<div class="sub">${C.rs>0?'Respawning…':Math.max(0,Math.ceil(C.mhp))+' / '+M.hp+' HP'}</div>${bar(pc(C.mt,M.sp),'thin')}<div class="hit">${C.last!=null&&C.last>0?'−'+C.last:C.last===0?'miss':''}</div></div></div>

  else b=`<div class="stats"><span>Total level <b>${i.tl}</b></span><span>Combat <b>${i.cl}</b></span><span>🪙 <b>${fmt(i.coins)}</b></span><span>Played <b>${fmtT(i.play)}</b></span><span>Saved <b>${ago(i.saved)}</b></span></div>
   ${i.bak?'<div class="gold">The main save could not be read. This is the automatic backup.</div>':''}
   <div class="row">${cur?'<span class="tag on">Playing now</span>':`<button class="btn pri" data-a="slotplay" data-n="${n}">Play</button>`}${cur?'':(m.delN===n?`<button class="btn dng" data-a="slotdel" data-n="${n}">Yes, delete it</button><button class="btn" data-a="slotcancel">Keep</button>`:`<button class="btn" data-a="slotdelask" data-n="${n}">Delete</button>`)}</div>`;
  h+=`<div class="slotc${cur?' cur':''}"><div class="sh"><b>Slot ${n}</b>${i?`<span>${i.name}</span>`:''}</div>${b}</div>`;}
 return`<div class="modal"><div class="mbox"><h2>${m.boot?'Choose a save':'Your saves'}</h2><div class="sub">Each slot is a separate game saved in this browser. Progress saves automatically.</div>${h}
 <div class="row"><button class="tag${mt.auto?' on':''}" data-a="slotauto" aria-pressed="${mt.auto}">Skip this screen and continue my last save</button></div>
 ${m.boot?'':'<div class="row"><button class="btn" data-a="closemodal">Back to game</button></div>'}</div></div>`;}
function enterSlot(n,s){
 SLOT=n;SAVESTAT.ok=true;SAVESTAT.bak=0;useState(s);claim(n);const m=getMeta();m.last=n;setMeta(m);UI.modal=null;UI.page='home';UI.bsel=null;UI.confirm=false;UI.msg='';
 const away=(Date.now()-(s.saved||Date.now()))/1000;
 if(away>=30){const r=simulateOffline(away);if(away>=120&&(r.coins>0||Object.keys(r.xp).length||Object.keys(r.items).length))UI.modal={type:'offline',r,away};}
 const h=location.hash.replace('#','');if(h&&(['home','combat','equip','bank','shop','wheel','set'].includes(h)||SKILLS.some(x=>x[0]===h)))UI.page=h;
 saveLocal();}
function playSlot(n,force){const r=readSlot(n);if(!r||r.bad)return;if(!force&&lockedElsewhere(n)){UI.modal.warn=n;UI.modal.newN=null;UI.modal.delN=null;return;}enterSlot(n,r.s);if(r.bak)toast('Loaded the automatic backup for this slot.','warn');}
function leaveSlot(){if(S){saveLocal();release();}S=null;SLOT=0;UI.modal={type:'slots',boot:true,newN:null,delN:null,warn:null};}
function modalHtml(){const m=UI.modal;if(!m)return'';
 if(m.type==='slots')return slotsModal(m);
 if(m.type==='prestige'){const k=m.sk,n=prN(k)+1;return`<div class="modal"><div class="mbox"><h2>Prestige ${SKN[k].n}?</h2><div class="sub">${SKN[k].n} goes back to level ${k==='hp'?10:1} and gains <b>prestige ${n}</b>, which gives <b>+${Math.round(PRES_B*n*100)}% XP</b> in ${SKN[k].n} from then on. Items, coins, gear and mastery are kept. Any action running in this skill will stop.</div><div class="row"><button class="btn pri" data-a="presgo" data-sk="${k}">Prestige</button><button class="btn" data-a="closemodal">Cancel</button></div></div></div>`;}
 if(m.type==='offline'){const r=m.r;
  const xp=Object.keys(r.xp).map(k=>`<tr><td>${SKN[k].i} ${SKN[k].n}</td><td>+${fmt(r.xp[k])} XP</td></tr>`).join('');
  const it=Object.keys(r.items).sort((a,b)=>r.items[b]*ITEMS[b].v-r.items[a]*ITEMS[a].v).slice(0,12).map(k=>`<span class="chip">${ITEMS[k].i} ${ITEMS[k].n} ×${fmt(r.items[k])}</span>`).join(' ');
  return`<div class="modal"><div class="mbox"><h2>Welcome back</h2><div class="sub">You were away for ${fmtT(m.away)}${m.away>offCap()?' (progress is capped at '+Math.round(offCap()/3600)+' hours)':''}.</div>
  ${r.stopped?'<div class="gold">Your activity stopped before you returned (out of materials, supplies or health).</div>':''}
  <div class="stats"><span>🪙 <b>+${fmt(r.coins)}</b></span>${r.kills?`<span>Kills <b>${fmt(r.kills)}</b></span>`:''}${r.deaths?`<span>Knocked out <b>${r.deaths}</b></span>`:''}</div>
  ${xp?`<table>${xp}</table>`:''}${it?`<div class="io">${it}</div>`:''}<button class="btn pri" data-a="closemodal">Continue</button></div></div>`;}
 if(m.type==='pick'){const sl='ABC'[m.slot];
  const run=sk=>S.acts.findIndex((a,i)=>a&&a.sk===sk&&i!==m.slot);
  const b=(p,ic,n,sk)=>{const r=run(sk);return`<button class="tile" data-a="pickgo" data-p="${p}"><div class="tl"><span>${ic} ${n}</span><span>${r>=0?'in '+'ABC'[r]:lv(sk)}</span></div></button>`;};
  let g=b('combat','⚔️','Combat','combat');SKILLS.forEach(s=>{g+=b(s[0],s[2],s[1],s[0]);});
  return`<div class="modal"><div class="mbox"><h2>Start in slot ${sl}</h2><div class="sub">Pick a skill, then choose an action on its page. It will start in slot ${sl}. A skill already running in the other slot shows its letter.</div><div class="grid sm">${g}</div><button class="btn" data-a="closemodal">Cancel</button></div></div>`;}
 if(m.type==='export')return`<div class="modal"><div class="mbox"><h2>Backup text</h2><div class="sub">Select all and copy this text, then store it somewhere safe.</div><textarea id="exp" readonly>${m.txt}</textarea><div class="row"><button class="btn pri" data-a="copyexp">Copy</button><button class="btn" data-a="closemodal">Close</button></div></div></div>`;
 return'';}

let lastNav='',lastKey='';
function render(){
 if(!S){paint($('#modal'),modalHtml());return;}
 document.documentElement.dataset.theme=S.theme==='auto'?'':S.theme;if(S.theme==='auto')document.documentElement.removeAttribute('data-theme');
 $('#app').classList.toggle('open',UI.navOpen);
 paint($('#rail'),navHtml());paint($('#top'),topHtml());paint($('#page'),pageHtml());paint($('#toasts'),toastHtml());paint($('#modal'),modalHtml());paint($('#ctx'),ctxHtml());}

/* ---------- actions ---------- */
function go(p){UI.page=p;UI.navOpen=false;window.scrollTo(0,0);try{history.replaceState(null,'','#'+p);}catch(e){}}
function nextSlot(){if(S.acts[UI.tgt]){const o=S.acts.findIndex((a,i)=>!a&&i!==UI.tgt);if(o>=0)UI.tgt=o;}}
function handle(d){
 switch(d.a){
  case'nav':go(d.p);break;case'navtoggle':UI.navOpen=!UI.navOpen;break;
  case'start':startAction(d.sk,d.id,UI.tgt);nextSlot();break;case'stop':stopAll();break;case'dgn':startDungeon(d.id);if(S.cb&&S.cb.dg===d.id)go('combat');break;case'bagall':bagCollect();break;case'bagsell':bagSellAll();break;case'bagmode':S.bag.mode=S.bag.mode==='stop'?'bank':'stop';break;case'bagtake':if(!bagTake(d.id))toast('Your bank has no room for that.','warn');break;case'buybag':buyBag();break;case'slot':{UI.tgt=+d.i;const A=S.acts[UI.tgt];if(!A)UI.modal={type:'pick',slot:UI.tgt};else go(A.sk==='combat'?'combat':A.sk);}break;case'pickgo':UI.modal=null;go(d.p);break;case'stopslot':clearSlot(+d.i);UI.tgt=+d.i;break;
  case'mon':startCombat(UI.area,d.id,UI.tgt);nextSlot();if(S.cb){S.cb.stance=UI.stance||0;S.cb.spell=UI.spell||0;}break;case'area':UI.area=d.id;break;
  case'stance':if(S.cb)S.cb.stance=+d.i;UI.stance=+d.i;break;
  case'spell':if(lv('mag')>=SPELLS[+d.i].lvl){if(S.cb)S.cb.spell=+d.i;UI.spell=+d.i;}break;
  case'eslot':UI.slot=UI.slot===d.s?null:d.s;break;case'equip':equip(d.id);break;case'unequip':unequip(d.s);break;
  case'bsel':UI.bsel=d.id;break;case'bcat':UI.bcat=d.c;break;
  case'sell':sell(d.id,+d.q);break;case'drink':usePotion(d.id);break;
  case'upg':buyUpg(d.sk);break;case'buybank':buyBank();break;case'buyplot':buyPlot(d.c);break;case'buyi':buyItem(d.id,+d.q);break;case'buyperk':buyPerk(d.id);break;
  case'pick':UI.pick=+d.i;break;case'pickclose':UI.pick=null;break;
  case'plant':if(UI.pick!=null&&plant(UI.pick,d.crop))UI.pick=null;break;
  case'harvest':harvest(+d.i);break;case'harvestall':{const n=harvestAll();if(!n)toast('Nothing is ready yet','warn');}break;case'autoplant':S.farm.auto=!S.farm.auto;break;
  case'theme':S.theme=d.t;break;
  case'export':UI.modal={type:'export',txt:exportSave()};break;
  case'copyexp':{const t=$('#exp');if(t){t.select();try{navigator.clipboard.writeText(t.value).then(()=>toast('Copied','info'),()=>{});}catch(e){}}}break;
  case'import':try{const s=importSave($('#imp').value);s.name=s.name||S.name;SAVESTAT.bak=0;saveLocal();useState(s);saveLocal();UI.msg='Backup loaded.';UI.imp='';}catch(e){UI.msg='That backup text could not be read or failed verification.';}break;
  case'resetask':UI.confirm=true;break;case'resetno':UI.confirm=false;break;
  case'reset':{const nm=S.name;SAVESTAT.bak=0;saveLocal();const f=newState();f.name=nm;useState(f);saveLocal();}UI.confirm=false;UI.page='home';UI.bsel=null;break;
  case'slotnewask':UI.modal.newN=+d.n;UI.modal.delN=null;UI.modal.warn=null;UI.nm='';break;
  case'slotnew':{const n=+d.n,s=newState();s.name=cleanName(UI.nm)||'Adventurer';deleteSlot(n);enterSlot(n,s);toast('Welcome, '+s.name+'! Pick a skill on the left to begin.','info');}break;
  case'slotplay':playSlot(+d.n,false);break;case'slotforce':playSlot(+d.n,true);break;
  case'slotdelask':UI.modal.delN=+d.n;UI.modal.newN=null;UI.modal.warn=null;break;
  case'slotdel':deleteSlot(+d.n);UI.modal.delN=null;break;
  case'slotcancel':UI.modal.newN=null;UI.modal.delN=null;UI.modal.warn=null;break;
  case'slotauto':{const m=getMeta();m.auto=!m.auto;setMeta(m);}break;
  case'slots':saveLocal();UI.modal={type:'slots',boot:false,newN:null,delN:null,warn:null};break;
  case'savenow':saveLocal();break;
  case'rename':{const n=cleanName(UI.rn);if(n){S.name=n;UI.rn='';saveLocal();}}break;
  case'switchslot':leaveSlot();break;
  case'presask':if(canPrestige(d.sk))UI.modal={type:'prestige',sk:d.sk};break;case'presgo':prestige(d.sk);UI.modal=null;break;
  case'closemodal':UI.modal=null;break;
  case'ctxsel':UI.bsel=d.id;UI.page='bank';break;
  case'spin':case'spinpaid':{if(UI.wspin&&Date.now()<UI.wspin)break;const r=spinWheel(d.a==='spinpaid');if(r){const seg=360/WHEEL.length,cur=UI.wrot||0;UI.wrot=Math.ceil(cur/360)*360+360*6+(360-(r.idx+.5)*seg)+(Math.random()-.5)*seg*.6;UI.wspin=Date.now()+4400;setTimeout(render,4500);if(r.idx>=6)setTimeout(()=>toast('Wheel prize: '+WHEEL[r.idx].n+'!','boss'),4400);}}break;
  case'cheat':{const el=$('#cheat'),r=cheat(el?el.value:'');UI.msg2=r||'That code is not recognised.';if(r&&el){el.value='';UI.cheat='';}saveLocal();}break;}
 render();}
document.addEventListener('click',e=>{if(UI.noclick>Date.now()){e.preventDefault();return;}const had=!!UI.ctx;UI.ctx=null;const el=e.target.closest('[data-a]');if(!el||el.dataset.a==='noop'){if(had)render();return;}e.preventDefault();handle(el.dataset);});
document.addEventListener('contextmenu',e=>{const el=e.target.closest('[data-ctx]');if(!el)return;e.preventDefault();const d=el.dataset;UI.ctx={t:d.ctx,id:d.id,s:d.s,x:e.clientX,y:e.clientY};if(d.ctx==='item')UI.bsel=d.id;render();});
document.addEventListener('dblclick',e=>{const el=e.target.closest('.bank [data-ctx="item"]');if(el&&ITEMS[el.dataset.id].slot){equip(el.dataset.id);render();}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&UI.ctx){UI.ctx=null;render();}});
window.addEventListener('scroll',()=>{if(UI.ctx){UI.ctx=null;render();}},{passive:true});
let lpT=null;
document.addEventListener('touchstart',e=>{const el=e.target.closest('[data-ctx]');if(!el)return;const t=e.touches[0],d=el.dataset;lpT=setTimeout(()=>{lpT=null;UI.ctx={t:d.ctx,id:d.id,s:d.s,x:t.clientX,y:t.clientY};if(d.ctx==='item')UI.bsel=d.id;UI.noclick=Date.now()+700;render();},500);},{passive:true});
['touchend','touchmove','touchcancel'].forEach(ev=>document.addEventListener(ev,()=>{if(lpT){clearTimeout(lpT);lpT=null;}},{passive:true}));
document.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.matches&&e.target.matches('[role=button][data-a]')){e.preventDefault();handle(e.target.dataset);}});
document.addEventListener('input',e=>{if(e.target.id==='bsearch'){UI.bq=e.target.value;render();}if(e.target.id==='imp')UI.imp=e.target.value;if(e.target.id==='cheat')UI.cheat=e.target.value;if(e.target.id==='nm')UI.nm=e.target.value;if(e.target.id==='rn')UI.rn=e.target.value;});

/* ---------- boot + loop ---------- */

const TIP=document.createElement('div');TIP.id='tip';TIP.className='tip';TIP.hidden=true;document.body.appendChild(TIP);
function tipMove(e){if(e.pointerType&&e.pointerType!=='mouse'){TIP.hidden=true;return;}
 const el=e.target.closest?e.target.closest('[data-tip]'):null;if(!el||!S||UI.ctx){TIP.hidden=true;return;}
 TIP.innerHTML=tipHtml(el.dataset.tip);TIP.hidden=false;
 const w=TIP.offsetWidth,h=TIP.offsetHeight;let x=e.clientX+16,y=e.clientY+16;
 if(x+w>innerWidth-8)x=Math.max(8,e.clientX-w-12);if(y+h>innerHeight-8)y=Math.max(8,e.clientY-h-12);
 TIP.style.left=x+'px';TIP.style.top=y+'px';}
document.addEventListener('pointermove',tipMove);
['click','scroll','keydown','contextmenu'].forEach(ev=>document.addEventListener(ev,()=>{TIP.hidden=true;},{passive:true,capture:true}));
document.documentElement.addEventListener('mouseleave',()=>{TIP.hidden=true;});
function boot(){
 migrateLegacy();
 const mt=getMeta();let entered=false;
 if(mt.auto&&mt.last&&!lockedElsewhere(mt.last)){const r=readSlot(mt.last);if(r&&!r.bad){enterSlot(mt.last,r.s);entered=true;}}
 if(!entered)UI.modal={type:'slots',boot:true,newN:null,delN:null,warn:null};
 render();
 let last=performance.now(),acc=0;
 setInterval(()=>{const now=performance.now();let d=(now-last)/1000;last=now;if(!S)return;
  if(d>3){const r=simulateOffline(d);if(d>=60&&!UI.modal&&(r.coins>0||Object.keys(r.xp).length))UI.modal={type:'offline',r,away:d};}
  else{acc+=d*(S.cheat.speed||1);let n=0;while(acc>=0.1&&n++<400){step(0.1);acc-=0.1;}}},100);
 setInterval(()=>{if(!document.hidden)render();},200);
 setInterval(saveLocal,10000);
 document.addEventListener('visibilitychange',()=>{if(document.hidden)saveLocal();});
 window.addEventListener('pagehide',()=>{saveLocal();release();});}
boot();
function __df(o){if(o&&typeof o==="object"&&!Object.isFrozen(o)){Object.freeze(o);Object.getOwnPropertyNames(o).forEach(function(k){try{__df(o[k]);}catch(e){}});}}
try{[ITEMS,MONS,SPELLS,DUNGEONS,CROP,ACT,RELICS,SUPPLY,THIEF].forEach(__df);}catch(e){}
})();
</script>
